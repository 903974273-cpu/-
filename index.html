<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>营销贾维斯管家</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --sidebar: #ffffff;
      --panel: #ffffff;
      --ink: #151b2d;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f2f5f9;
      --brand: #2563eb;
      --brand-soft: #eaf2ff;
      --green: #16a34a;
      --shadow: 0 14px 36px rgba(17, 24, 39, .08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, textarea {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--sidebar);
      padding: 18px 14px;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 14px;
      height: 100vh;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 4px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 6px 12px rgba(37, 99, 235, .28));
      flex: 0 0 auto;
    }

    .brand strong {
      display: block;
      font-size: 15px;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .new-chat {
      width: 100%;
      height: 42px;
      border: 1px solid var(--brand);
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .history-title {
      padding: 4px 8px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .history {
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 6px;
      padding-right: 3px;
      min-height: 0;
    }

    .history-item {
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #374151;
      padding: 10px;
      text-align: left;
      cursor: pointer;
      display: grid;
      gap: 4px;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--soft);
    }

    .history-item strong {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding: 14px 8px 2px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 0;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 800;
      flex: 0 0 auto;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      height: 100vh;
      overflow: hidden;
    }

    .system-tabs {
      display: flex;
      gap: 8px;
      overflow: auto;
      padding: 2px 2px 6px;
    }

    .system-tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #374151;
      height: 34px;
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 650;
      box-shadow: 0 4px 12px rgba(17, 24, 39, .04);
    }

    .system-tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .2);
    }

    .chat {
      overflow: auto;
      padding: 22px 24px 18px;
      min-height: 0;
      overscroll-behavior: contain;
    }

    .chat-inner {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 20px;
      min-height: 100%;
    }

    .conversation {
      display: grid;
      gap: 20px;
      min-height: 0;
    }

    .composer-system-picker {
      display: grid;
      gap: 9px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .composer-system-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .composer-system-head strong { color: var(--ink); }

    .chat-inner.empty .welcome {
      align-self: center;
    }

    .welcome {
      width: min(680px, 100%);
      margin: auto;
      text-align: center;
      padding: 36px 24px;
    }

    .welcome-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      filter: drop-shadow(0 10px 18px rgba(37, 99, 235, .22));
    }

    .welcome-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .welcome h2 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.32;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .quick {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .quick button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 9px 14px;
      text-align: left;
      cursor: pointer;
      color: #374151;
    }

    .quick button:hover {
      border-color: #b8d3ff;
      background: var(--brand-soft);
      color: #174ea6;
    }

    .msg {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      animation: rise .2s ease-out both;
    }

    .msg.user {
      grid-template-columns: minmax(0, 1fr) 38px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bot-avatar,
    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .bot-avatar {
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
    }

    .user-avatar {
      background: #e5e7eb;
      color: #4b5563;
    }

    .bubble {
      width: fit-content;
      max-width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px 15px;
      line-height: 1.65;
      font-size: 14px;
      box-shadow: 0 8px 22px rgba(17, 24, 39, .06);
    }

    .msg.user .bubble {
      justify-self: end;
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, .18);
    }

    .bubble p {
      margin: 0;
    }

    .bubble p + p {
      margin-top: 8px;
    }

    .bubble ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }

    .bubble li + li {
      margin-top: 5px;
    }

    .answer-title {
      display: block;
      margin-bottom: 5px;
      font-weight: 800;
    }

    .source-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 11px;
    }

    .source {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4f91;
      border: 1px solid #cfe3ff;
      font-size: 12px;
      font-weight: 650;
    }

    .image-preview {
      margin-top: 10px;
      width: 280px;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.18);
    }

    .image-preview img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      height: 22px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
      animation: typing 1s infinite ease-in-out;
    }

    .typing i:nth-child(2) { animation-delay: .12s; }
    .typing i:nth-child(3) { animation-delay: .24s; }

    @keyframes typing {
      0%, 80%, 100% { transform: translateY(0); opacity: .45; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .composer-area {
      border-top: 1px solid var(--line);
      background: rgba(247,248,251,.92);
      padding: 14px 24px 22px;
      z-index: 4;
    }

    .composer {
      width: min(980px, 100%);
      margin: 0 auto;
      border: 1px solid #cfd8e6;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(17, 24, 39, .1);
      padding: 12px;
    }

    .attachment-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #1d4f91;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 650;
    }

    .pill button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 0;
      font-weight: 800;
    }

    textarea {
      width: 100%;
      min-height: 58px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
    }

    textarea::placeholder {
      color: #9ca3af;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .tool-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .icon-btn,
    .send-btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      height: 38px;
      cursor: pointer;
      font-weight: 700;
    }

    .icon-btn {
      width: 38px;
      font-size: 18px;
    }

    .send-btn {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
      padding: 0 18px;
    }

    .send-btn:hover,
    .new-chat:hover {
      filter: brightness(.96);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .chat {
        padding: 18px 14px;
      }
      .composer-area {
        padding: 12px 14px 18px;
      }
      .msg.user .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-label="营销贾维斯管家标识">
          <svg viewBox="0 0 48 48" width="38" height="38" aria-hidden="true">
            <defs>
              <linearGradient id="jarvisGradient" x1="7" y1="6" x2="41" y2="43" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4f8cff" />
                <stop offset="1" stop-color="#153eaa" />
              </linearGradient>
            </defs>
            <path d="M24 2.8 42.5 13.5v21L24 45.2 5.5 34.5v-21L24 2.8Z" fill="url(#jarvisGradient)" />
            <path d="M24 9.6 36.7 17v14L24 38.4 11.3 31V17L24 9.6Z" fill="none" stroke="#c9e6ff" stroke-width="1.5" opacity=".9" />
            <circle cx="24" cy="24" r="5.2" fill="#fff" />
            <path d="M24 15.1v3M24 29.9v3M15.1 24h3M29.9 24h3" stroke="#c9e6ff" stroke-width="1.7" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <strong>营销贾维斯管家</strong>
          <span>营销业务逻辑助手</span>
        </div>
      </div>

      <button class="new-chat" id="newChatBtn">＋ 新建对话</button>

      <a href="analytics.html" style="display:flex;align-items:center;justify-content:center;height:36px;border:1px solid var(--line);border-radius:9px;color:#4b5563;text-decoration:none;font-size:12px;font-weight:700;background:#fff">数据分析后台</a>

      <div class="history-title">历史对话</div>
      <div class="history" id="history">
        <button class="history-item active" data-system="营销平台" data-title="新人券为什么没命中">
          <strong>新人券为什么没命中</strong>
          <span>营销平台 · 3 分钟前</span>
        </button>
        <button class="history-item" data-system="商品中心" data-title="商品标签影响活动展示吗">
          <strong>商品标签影响活动展示吗</strong>
          <span>商品中心 · 今天 11:24</span>
        </button>
        <button class="history-item" data-system="定制活动" data-title="定制活动不可叠加规则">
          <strong>定制活动不可叠加规则</strong>
          <span>定制活动 · 昨天</span>
        </button>
        <button class="history-item" data-system="任务中心" data-title="省钱任务返现发放条件">
          <strong>省钱任务返现发放条件</strong>
          <span>任务中心 · 周一</span>
        </button>
        <button class="history-item" data-system="里程" data-title="里程抵扣和券能否同用">
          <strong>里程抵扣和券能否同用</strong>
          <span>里程 · 上周</span>
        </button>
      </div>

      <div class="profile">
        <div class="avatar">PM</div>
        <div>
          <strong style="color:#374151">王小明</strong><br>
          <span>工号：100862</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="chat" id="chat">
        <div class="chat-inner empty" id="chatInner">
          <div class="conversation" id="conversation">
            <div class="welcome" id="welcome">
              <div class="welcome-mark" aria-label="营销贾维斯管家头像">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                  <defs>
                    <linearGradient id="welcomeJarvisGradient" x1="7" y1="6" x2="41" y2="43" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#4f8cff" />
                      <stop offset="1" stop-color="#153eaa" />
                    </linearGradient>
                  </defs>
                  <path d="M24 2.8 42.5 13.5v21L24 45.2 5.5 34.5v-21L24 2.8Z" fill="url(#welcomeJarvisGradient)" />
                  <path d="M24 9.6 36.7 17v14L24 38.4 11.3 31V17L24 9.6Z" fill="none" stroke="#c9e6ff" stroke-width="1.5" opacity=".9" />
                  <circle cx="24" cy="24" r="5.2" fill="#fff" />
                  <path d="M24 15.1v3M24 29.9v3M15.1 24h3M29.9 24h3" stroke="#c9e6ff" stroke-width="1.7" stroke-linecap="round" />
                </svg>
              </div>
              <h2>营销贾维斯解决您的一切营销问题</h2>
              <p>选择一个或多个关联系统后，直接输入问题，或上传活动配置、前端页面和运营后台截图。</p>
              <div class="quick">
                <button data-question="请帮我审核这份营销需求文档的逻辑是否完整">文档审核</button>
                <button data-question="这个活动为什么前端展示了但下单没有优惠？">业务问答</button>
                <button data-question="请梳理这个活动从创建到上线的操作流程">操作流程</button>
                <button data-question="我是新人，请带我快速了解当前系统的核心业务规则">新人带教</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="composer-area">
        <div class="composer">
          <div class="composer-system-picker">
            <div class="composer-system-head">
              <strong>关联系统</strong>
              <span id="selectedHint">已选择 1 个系统，可多选</span>
            </div>
            <nav class="system-tabs" id="systemTabs" aria-label="选择关联系统，可多选">
              <button class="system-tab" data-system="商品中心" aria-pressed="false">商品中心</button>
              <button class="system-tab active" data-system="营销平台" aria-pressed="true">营销平台</button>
              <button class="system-tab" data-system="定制活动" aria-pressed="false">定制活动</button>
              <button class="system-tab" data-system="里程" aria-pressed="false">里程</button>
              <button class="system-tab" data-system="任务中心" aria-pressed="false">任务中心</button>
              <button class="system-tab" data-system="优惠券中心" aria-pressed="false">优惠券中心</button>
              <button class="system-tab" data-system="价格试算" aria-pressed="false">价格试算</button>
            </nav>
          </div>
          <div class="attachment-row" id="attachmentRow">
            <span class="pill">关联系统：<b id="currentSystemLabel">营销平台</b></span>
            <span class="pill">支持文字和图片</span>
          </div>
          <textarea id="questionInput" placeholder="输入问题，例如：这个活动为什么前端展示了但下单没优惠？"></textarea>
          <div class="composer-actions">
            <div class="tool-row">
              <input id="imageInput" type="file" accept="image/*" hidden />
              <button class="icon-btn" id="uploadBtn" title="上传图片">＋</button>
              <span id="uploadText">上传图片后可直接问截图里的配置含义</span>
            </div>
            <button class="send-btn" id="sendBtn">发送</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    const tabs = document.querySelectorAll(".system-tab");
    const selectedHint = document.querySelector("#selectedHint");
    const chat = document.querySelector("#chat");
    const chatInner = document.querySelector("#chatInner");
    const conversation = document.querySelector("#conversation");
    const questionInput = document.querySelector("#questionInput");
    const sendBtn = document.querySelector("#sendBtn");
    const uploadBtn = document.querySelector("#uploadBtn");
    const imageInput = document.querySelector("#imageInput");
    const attachmentRow = document.querySelector("#attachmentRow");
    const historyItems = document.querySelectorAll(".history-item");
    const newChatBtn = document.querySelector("#newChatBtn");
    const selectedSystems = new Set(["营销平台"]);
    let uploadedImageUrl = "";

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[char]));
    }

    function selectedSystemText() { return Array.from(selectedSystems).join("、"); }

    function updateSystemSelection() {
      tabs.forEach(tab => {
        const active = selectedSystems.has(tab.dataset.system);
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-pressed", String(active));
      });
      selectedHint.textContent = `已选择 ${selectedSystems.size} 个系统，可多选`;
      const label = document.querySelector("#currentSystemLabel");
      if (label) label.textContent = selectedSystemText();
    }

    function selectOnlySystem(name) {
      selectedSystems.clear();
      selectedSystems.add(name);
      updateSystemSelection();
    }

    function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

    function userMessage(text, imageUrl) {
      return `<div class="msg user"><div class="bubble">${escapeHtml(text).replace(/\n/g, "<br>")}${imageUrl ? `<div class="image-preview"><img src="${imageUrl}" alt="上传截图"></div>` : ""}</div><div class="user-avatar">你</div></div>`;
    }

    function aiMessage(html) {
      return `<div class="msg ai"><div class="bot-avatar">AI</div><div class="bubble">${html}</div></div>`;
    }

    function buildAnswer(question, hasImage) {
      const q = question.toLowerCase();
      const systems = selectedSystemText();
      let title = `结论：我会按「${systems}」的业务规则来回答。`;
      let points = ["先确认问题属于展示、领取、下单、支付、退款或奖励发放哪个动作。", "再看活动、券或任务是否满足时间、库存、人群、渠道和互斥条件。", "需要定位具体用户时，请补充用户 ID、活动 ID、券模板 ID 或订单号。"];
      let sources = ["系统规则", "配置项", "接口返回"];
      if (hasImage || q.includes("截图") || q.includes("图片") || q.includes("配置")) {
        title = "结论：截图里的配置会影响用户是否可见、可领或可用。";
        points = ["我会识别截图里的活动名称、限制条件和字段含义。", "“限新客”“不可叠加”“指定渠道”等字段会在下单时由后端再次校验。", "页面展示可以相对宽松，最终优惠金额和可用状态应以后端返回为准。"];
        sources = ["图片识别", "活动配置", "后端校验"];
      } else if (q.includes("新人") || q.includes("新客") || q.includes("没拿到")) {
        title = "结论：没有拿到新人券，优先看新人资格和券模板状态。";
        points = ["用户看到入口不代表一定满足新人资格；发券时通常会查历史有效支付订单。", "券模板过期、库存不足或渠道不匹配，也会导致领取失败。", "订单命中其他不可叠加优惠时，下单页可能不会展示这张券。"];
        sources = ["新人规则", "券模板", "优惠互斥"];
      } else if (q.includes("前端") || q.includes("展示") || q.includes("页面")) {
        title = "结论：前端不建议自行复刻复杂营销判断。";
        points = ["活动入口可以按活动状态、时间和渠道展示。", "券按钮状态、不可用原因和优惠金额，应以后端接口返回为准。", "后端若返回不可用原因，前端可直接展示给用户或运营。"];
        sources = ["展示规则", "可用状态", "试算接口"];
      } else if (q.includes("退款") || q.includes("退回") || q.includes("退券")) {
        title = "结论：退款后是否退券，要看券状态和退款场景。";
        points = ["未使用优惠和已核销优惠的处理方式不同。", "全额退款、部分退款、取消订单可能走不同退券规则。", "重复退款或回调重试时，一般要按订单号和券流水做幂等。"];
        sources = ["退券规则", "订单状态", "幂等处理"];
      }
      return `<p><span class="answer-title">${title}</span></p><ul>${points.map(point => `<li>${point}</li>`).join("")}</ul><p>你可以继续补充具体 ID 或截图，我会继续沿着「${systems}」回答。</p><div class="source-row">${sources.map(source => `<span class="source">${source}</span>`).join("")}</div>`;
    }

    function resetAttachment() {
      uploadedImageUrl = "";
      attachmentRow.innerHTML = `<span class="pill">关联系统：<b id="currentSystemLabel">${selectedSystemText()}</b></span><span class="pill">支持文字和图片</span>`;
    }

    function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question && !uploadedImageUrl) return;
      const imageUrl = uploadedImageUrl;
      chatInner.classList.remove("empty");
      document.querySelector("#welcome")?.remove();
      conversation.insertAdjacentHTML("beforeend", userMessage(question || "请解析这张截图里的业务配置", imageUrl));
      questionInput.value = "";
      resetAttachment();
      const typingId = `typing-${Date.now()}`;
      conversation.insertAdjacentHTML("beforeend", `<div id="${typingId}">${aiMessage(`<span class="typing"><i></i><i></i><i></i></span>`)}</div>`);
      scrollBottom();
      setTimeout(() => {
        document.querySelector(`#${typingId}`)?.remove();
        conversation.insertAdjacentHTML("beforeend", aiMessage(buildAnswer(question, Boolean(imageUrl))));
        scrollBottom();
      }, 650);
    }

    function welcomeMarkup() {
      return `<div class="welcome" id="welcome">
        <div class="welcome-mark" aria-label="营销贾维斯管家头像">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <defs><linearGradient id="newChatJarvisGradient" x1="7" y1="6" x2="41" y2="43" gradientUnits="userSpaceOnUse"><stop stop-color="#4f8cff" /><stop offset="1" stop-color="#153eaa" /></linearGradient></defs>
            <path d="M24 2.8 42.5 13.5v21L24 45.2 5.5 34.5v-21L24 2.8Z" fill="url(#newChatJarvisGradient)" />
            <path d="M24 9.6 36.7 17v14L24 38.4 11.3 31V17L24 9.6Z" fill="none" stroke="#c9e6ff" stroke-width="1.5" opacity=".9" />
            <circle cx="24" cy="24" r="5.2" fill="#fff" /><path d="M24 15.1v3M24 29.9v3M15.1 24h3M29.9 24h3" stroke="#c9e6ff" stroke-width="1.7" stroke-linecap="round" />
          </svg>
        </div>
        <h2>营销贾维斯解决您的一切营销问题</h2>
        <p>选择一个或多个关联系统后，直接输入问题，或上传活动配置、前端页面和运营后台截图。</p>
        <div class="quick">
          <button data-question="请帮我审核这份营销需求文档的逻辑是否完整">文档审核</button>
          <button data-question="这个活动为什么前端展示了但下单没有优惠？">业务问答</button>
          <button data-question="请梳理这个活动从创建到上线的操作流程">操作流程</button>
          <button data-question="我是新人，请带我快速了解当前系统的核心业务规则">新人带教</button>
        </div>
      </div>`;
    }

    tabs.forEach(tab => tab.addEventListener("click", () => {
      const name = tab.dataset.system;
      if (selectedSystems.has(name) && selectedSystems.size === 1) return;
      if (selectedSystems.has(name)) selectedSystems.delete(name); else selectedSystems.add(name);
      updateSystemSelection();
    }));

    conversation.addEventListener("click", event => {
      const button = event.target.closest("[data-question]");
      if (!button) return;
      questionInput.value = button.dataset.question;
      questionInput.focus();
    });

    historyItems.forEach(item => item.addEventListener("click", () => {
      historyItems.forEach(entry => entry.classList.remove("active"));
      item.classList.add("active");
      selectOnlySystem(item.dataset.system);
      chatInner.classList.remove("empty");
      conversation.innerHTML = `<div class="welcome"><h2>${escapeHtml(item.dataset.title)}</h2><p>已切换到历史对话。你可以继续追问，也可以上传截图补充上下文。</p></div>${aiMessage(`<p><span class="answer-title">已载入这段历史对话。</span></p><p>当前系统是「${item.dataset.system}」，后续问题会继续限定在这个系统内回答。</p>`)}`;
      scrollBottom();
    }));

    newChatBtn.addEventListener("click", () => {
      historyItems.forEach(entry => entry.classList.remove("active"));
      chatInner.classList.add("empty");
      conversation.innerHTML = welcomeMarkup();
      questionInput.value = "";
      resetAttachment();
      scrollBottom();
    });

    sendBtn.addEventListener("click", sendQuestion);
    questionInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendQuestion(); }
    });
    uploadBtn.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      uploadedImageUrl = URL.createObjectURL(file);
      attachmentRow.innerHTML = `<span class="pill">关联系统：<b>${selectedSystemText()}</b></span><span class="pill">已上传：${escapeHtml(file.name)} <button id="removeImage">×</button></span>`;
      document.querySelector("#removeImage").addEventListener("click", () => { imageInput.value = ""; resetAttachment(); });
      questionInput.focus();
    });

    updateSystemSelection();
  </script>
</body>
</html>
