&lt;style&gt;
  #rail-config {

    --rc-shadow: 0 3px 10px #0000000c;

    -webkit-font-smoothing: antialiased;

  #rail-config * { box-sizing: border-box; }
  #rail-config [hidden] { display: none !important; }
  #rail-config :is(p,h2,h3) { margin: 0; }
  #rail-config button, #rail-config input, #rail-config textarea, #rail-config select { font: inherit; }
  #rail-config button { min-height: 29px; }

  #rail-config .workspace-tabs button { border: 1px solid var(--rc-border); padding: 3px 8px; color: var(--rc-text); background: var(--rc-panel); border-radius: 0; font-size: 12px; }
  #rail-config .workspace-tabs button.active { background: var(--rc-blue-deep); border-color: var(--rc-blue-deep); color: #fff; }
  #rail-config .workspace-tabs button span { margin-left: 5px; opacity: .75; }
  #rail-config main { padding: 0 10px 15px; }
  #rail-config .breadcrumbs { display: flex; gap: 10px; align-items: center; padding: 11px 0 14px; }
  #rail-config .breadcrumbs span:nth-child(2) { color: #b5bdca; font-size: 19px; line-height: 1; }
  #rail-config .box { border: 1px solid var(--rc-divider); border-radius: 4px; background: var(--rc-panel); box-shadow: var(--rc-shadow); margin-bottom: 20px; }
  #rail-config .box-heading { padding: 14px 16px; border-bottom: 1px solid var(--rc-divider); }
  #rail-config .box-heading h2 { font-size: 15px; color: var(--rc-strong); font-weight: 500; }
  #rail-config .box-body { padding: 14px 15px 18px; }
  #rail-config .row { display: grid; grid-template-columns: var(--rc-label) minmax(0, 1fr); gap: 12px; align-items: start; margin-bottom: 13px; }
  #rail-config .row:last-child { margin-bottom: 0; }
  #rail-config .row &gt; :is(label,.label) { text-align: right; padding-top: 6px; }
  #rail-config .row &gt; :is(label,.label) b { color: var(--rc-danger); font-weight: 500; }
  #rail-config .row &gt; div { min-width: 0; }
  #rail-config .control { border: 1px solid var(--rc-border); color: var(--rc-text); background: var(--rc-panel); border-radius: 4px; min-height: 32px; padding: 4px 9px; width: 100%; min-width: 0; }
  #rail-config .control:focus { border-color: var(--rc-blue); outline-color: var(--rc-blue); }
  #rail-config .control::placeholder, #rail-config .control[readonly] { color: var(--rc-placeholder); }
  #rail-config .control:is([readonly],:disabled) { background: var(--rc-disabled); border-color: var(--rc-divider); }
  #rail-config .control.medium { width: min(100%, 270px); }
  #rail-config .control.wide { width: min(100%, 510px); }
  #rail-config .control.short { width: min(100%, 120px); }
  #rail-config .number { text-align: center; }
  #rail-config textarea.control { resize: vertical; min-height: 48px; }
  #rail-config .range { display: flex; align-items: center; gap: 7px; max-width: 400px; }
  #rail-config .date-range { border: 1px solid var(--rc-border); border-radius: 4px; padding: 0 3px; }
  #rail-config .date-range .control { border: 0; background: transparent; text-align: center; }
  #rail-config .choices { display: flex; align-items: center; gap: 7px 21px; flex-wrap: wrap; min-height: 32px; }
  #rail-config .choices label { display: inline-flex; align-items: center; gap: 7px; min-height: 26px; }
  #rail-config .choices label:has(input:checked) { color: #2376cc; }
  #rail-config .choices label:has(input:disabled) { color: var(--rc-placeholder); }
  #rail-config .choices input { accent-color: var(--rc-blue); width: 14px; height: 14px; margin: 0; flex: 0 0 auto; }
  #rail-config .choices input:is([type=&quot;radio&quot;],[type=&quot;checkbox&quot;]) { appearance: none; border: 1px solid var(--rc-border); background: var(--rc-panel); display: inline-grid; place-items: center; }
  #rail-config .choices input[type=&quot;radio&quot;] { border-radius: 50%; }
  #rail-config .choices input[type=&quot;checkbox&quot;] { border-radius: 2px; }

      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  const openRequestedPage = () => {
    const page = window.location.hash === '#exclusions' ? 'exclusions' : 'edit';
    frame.contentWindow?.postMessage({ type: 'rail-prototype-open-page', page }, '*');
  };
  frame.addEventListener('load', openRequestedPage);
  window.addEventListener('hashchange', openRequestedPage);
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
